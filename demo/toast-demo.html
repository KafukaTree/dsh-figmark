<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提示气泡 · figmark</title>
<style>
  /* Only the page around the bubbles is styled here: everything inside the panel is
     the plugin's own stylesheet, injected by ensureStyles, so the demo cannot drift
     from the product. */
  :root{ color-scheme:dark }
  html,body{margin:0;height:100%}
  body{background:#0e0e10;color:#f5f5f7;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:32px 24px;box-sizing:border-box}
  .demo{display:flex;gap:32px;align-items:flex-start}
  /* Two classes deep: the panel borrows `.da-root` for the stack's anchor, and the
     plugin's stylesheet lands in the head after this one. */
  .demo .demo-panel{position:relative;flex:0 0 auto;width:320px;height:460px;border-radius:18px;
    background:linear-gradient(180deg,#1c1c1f 0%,#141416 100%);
    border:0.5px solid rgba(255,255,255,.10);overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .demo-canvas{flex:1 1 auto;margin:14px;border-radius:12px;display:grid;place-items:center;
    background:repeating-linear-gradient(45deg,#1a1a1d 0 12px,#17171a 12px 24px);
    color:rgba(255,255,255,.22);font-size:12px;letter-spacing:.08em}
  .demo-side{width:372px;display:flex;flex-direction:column;gap:14px}
  .demo-switch{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.62);
    padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.045)}
  .demo-switch input{accent-color:#8e8e93;margin:0}
  .demo-actions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .demo-actions li{display:flex;flex-direction:column;gap:3px}
  .demo-actions button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.07);border:0.5px solid rgba(255,255,255,.12);
    font-size:13px;color:#f5f5f7;transition:background .18s ease}
  .demo-actions button:hover{background:rgba(255,255,255,.11)}
  .demo-actions button:active{background:rgba(255,255,255,.15)}
  .demo-actions button:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}
  .demo-actions span{padding-left:12px;font-size:11.5px;color:rgba(255,255,255,.40)}
  .demo-log-label{margin:2px 0 0;font-size:11.5px;color:rgba(255,255,255,.40)}
  .demo-log{margin:0;padding:10px 12px;border-radius:10px;min-height:58px;white-space:pre-wrap;
    word-break:break-word;background:rgba(255,255,255,.035);border:0.5px solid rgba(255,255,255,.08);
    font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<div id="app"></div>
<script src="./toast-demo.js"></script>
</body>
</html>
